services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: atelier
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atelier}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["atelier_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  atelier_data:
